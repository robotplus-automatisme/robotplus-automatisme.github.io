# GitHub Pages settings. The pages are plain HTML files: Jekyll only publishes them as they are.
title: "ROBOT+ Automatisme"
description: "Robotique, contrôle et machines spéciales à Marnaz (Haute-Savoie)."
lang: fr
# Generates /sitemap.xml and /robots.txt automatically, with the right domain.
plugins:
  - jekyll-sitemap
# Files that stay in the repository but are not published.
exclude:
  - README.md
  - CHANGES.md
  - tools/
