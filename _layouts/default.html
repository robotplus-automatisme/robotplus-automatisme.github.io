<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101317">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ROBOT+ accueil"><img src="{{ '/assets/robotplus-logo.jpg' | relative_url }}" alt="ROBOT+ Automatisme"></a>
      <button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="{{ '/' | relative_url }}">Accueil</a>
        <a href="{{ '/entreprise/' | relative_url }}">L'entreprise</a>
        <a href="{{ '/solutions/' | relative_url }}">Solutions</a>
        <a href="{{ '/references/' | relative_url }}">Réalisations</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a class="brand brand-footer" href="{{ '/' | relative_url }}"><img src="{{ '/assets/robotplus-logo.jpg' | relative_url }}" alt="ROBOT+ Automatisme"></a>
        <p>Automatisme · Robotique · Bureau d’études</p>
      </div>
      <div>
        <div class="footer-label">Adresse</div>
        <p>369 rue des Abeilles<br>74460 Marnaz · France</p>
      </div>
      <div>
        <div class="footer-label">Navigation</div>
        <p><a href="{{ '/solutions/' | relative_url }}">Solutions</a><br><a href="{{ '/contact/' | relative_url }}">Contact</a></p>
      </div>
    </div>
    <div class="container footer-bottom"><span>© {{ 'now' | date: '%Y' }} ROBOTPLUS</span><span>Site propulsé par Jekyll · GitHub Pages</span></div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
